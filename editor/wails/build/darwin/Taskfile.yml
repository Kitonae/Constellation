version: '3'

includes:
  common: ../Taskfile.yml

# The native renderer is built separately from editor/renderer (see its
# CMakeLists); when its build output exists it is staged into the bundle next
# to the editor binary, which is where the shell looks for it first.
vars:
  RENDERER_DIR: '{{.ROOT_DIR}}/../renderer/build'

tasks:
  build:
    summary: Builds the application for macOS
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application into a `.app` bundle
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: create:app:bundle

  create:app:bundle:
    summary: Creates the `.app` bundle, with the renderer beside the editor binary
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: stage:renderer
        vars:
          DEST: '{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS'
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  stage:renderer:
    summary: Copies the renderer and its NDI runtime into DEST when they have been built
    internal: true
    cmds:
      - |
        if [ -f "{{.RENDERER_DIR}}/constellation-renderer" ]; then
          cp "{{.RENDERER_DIR}}/constellation-renderer" "{{.DEST}}/"
          [ -f "{{.RENDERER_DIR}}/libndi.dylib" ] && cp "{{.RENDERER_DIR}}/libndi.dylib" "{{.DEST}}/" || true
          echo "Staged renderer from {{.RENDERER_DIR}}"
        else
          echo "No renderer at {{.RENDERER_DIR}}; build editor/renderer first for native output"
        fi

  run:
    summary: Runs a development build as an app bundle (so it has a bundle identity)
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - task: stage:renderer
        vars:
          DEST: '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS'
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'
